<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Little English Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with star counter, scrolling content, fixed two-tab bar (Learn / Play). Palette taken from the lesson posters: sky, sunshine, berry, grass. */
:root{
  --bg:#E9F5FF; --surface:#FFFFFF; --ink:#13305A; --muted:#566C91; --line:#C9E0F4;
  --sky:#2F9BF2; --sun:#FFC52E; --sun-ink:#4A3600; --berry:#7B54E6; --grass:#2FB463; --coral:#F0506E;
  --good:#1B9A52; --bad:#DB3D4B; --plate:#FFFFFF; --shadow:0 3px 0 rgba(19,48,90,.12), 0 8px 18px rgba(19,48,90,.08);
  --display:'Baloo 2','Nunito',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A33; --surface:#162848; --ink:#EAF2FF; --muted:#9FB4D8; --line:#2A4272;
    --sky:#5BB4FF; --berry:#A18CFF; --grass:#4FD08A; --coral:#FF7C93; --good:#4FD08A; --bad:#FF7C8A;
    --shadow:0 3px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A33; --surface:#162848; --ink:#EAF2FF; --muted:#9FB4D8; --line:#2A4272;
  --sky:#5BB4FF; --berry:#A18CFF; --grass:#4FD08A; --coral:#FF7C93; --good:#4FD08A; --bad:#FF7C8A;
  --shadow:0 3px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
svg.ic{width:1.2em;height:1.2em;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-weight:800;background:var(--surface);box-shadow:var(--shadow)}
.stars{color:var(--sun-ink)}
.stars svg{color:var(--sun);fill:currentColor;stroke:#C98F00;stroke-width:1}
.slow[aria-pressed="true"]{background:var(--sky);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stars{color:var(--ink)} :root:not([data-theme="light"]) .slow[aria-pressed="true"]{color:#06203f}}
:root[data-theme="dark"] .stars{color:var(--ink)} :root[data-theme="dark"] .slow[aria-pressed="true"]{color:#06203f}

/* now panel */
.now{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;background:var(--surface);border-radius:24px;padding:14px;box-shadow:var(--shadow);margin-top:4px}
.now .pic{width:104px;height:104px;border-radius:18px;background:var(--plate);display:grid;place-items:center;overflow:hidden}
.now .pic img{width:100%;height:100%;object-fit:contain}
.now h2{margin:0;font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;overflow-wrap:anywhere}
.now .vi{color:var(--muted);font-weight:700;margin-top:2px}
.now .say{font-weight:800;color:var(--berry);margin-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:800;background:var(--sky);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06203f}}
:root[data-theme="dark"] .btn{color:#06203f}
@media (max-width:380px){.now{grid-template-columns:1fr}.now .pic{width:100%;height:150px}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 14px;font-weight:800;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--berry);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#120a33}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#120a33}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding-block:10px 8px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border-radius:20px;padding:10px 8px 12px;box-shadow:var(--shadow);min-width:0;position:relative}
.card .th{width:100%;aspect-ratio:1/1;background:var(--plate);border-radius:14px;display:grid;place-items:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain}
.card .w{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1;text-align:center;overflow-wrap:anywhere}
.card.sel{outline:3px solid var(--sun)}
.card.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.07) rotate(-1.5deg)}100%{transform:none}}
.card .spk{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-size:.8rem}
.grid.intro{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.intro .w{font-size:.95rem}
.note{color:var(--muted);font-size:.85rem;font-weight:700;padding-block:10px 4px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);box-shadow:0 -4px 16px rgba(19,48,90,.1);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:16px;font-weight:800;color:var(--muted);font-family:var(--display);font-size:1.1rem}
.tab[aria-current="page"]{background:var(--sun);color:var(--sun-ink)}

/* games hub */
.hub{display:grid;gap:12px;padding-block:8px}
.gcard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.gcard .bd{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:1.9rem}
.gcard h3{margin:0;font-family:var(--display);font-size:1.3rem;line-height:1.1}
.gcard p{margin:3px 0 0;color:var(--muted);font-weight:700;font-size:.9rem}
.gcard .best{margin-top:6px;font-size:.8rem;font-weight:800;color:var(--berry)}
.bd.g1{background:var(--sky)}.bd.g2{background:var(--berry)}.bd.g3{background:var(--grass)}
.bd.g1,.bd.g2,.bd.g3{color:#fff}

/* game stage */
.gbar{display:flex;align-items:center;gap:10px;padding-block:6px 10px}
.gbar .ttl{flex:1;font-family:var(--display);font-weight:800;font-size:1.2rem;min-width:0}
.dots{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--coral)} .dots i.cur{background:var(--sun);outline:2px solid var(--ink);outline-offset:1px}
.prompt{text-align:center;background:var(--surface);border-radius:24px;padding:18px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.prompt h2{margin:0 0 4px;font-family:var(--display);font-size:1.5rem;line-height:1.15}
.prompt p{margin:0 0 12px;color:var(--muted);font-weight:700}
.bigspk{width:84px;height:84px;border-radius:50%;background:var(--sky);color:#fff;display:inline-grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2);font-size:2.2rem}
.bigspk:active{transform:translateY(3px);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bigspk{color:#06203f}}
:root[data-theme="dark"] .bigspk{color:#06203f}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--surface);border-radius:22px;padding:10px;box-shadow:var(--shadow);aspect-ratio:1/1;display:grid;place-items:center;min-width:0}
.opt .th{width:100%;height:100%;background:var(--plate);border-radius:14px;display:grid;place-items:center;overflow:hidden}
.opt img{width:100%;height:100%;object-fit:contain}
.opt.right{outline:4px solid var(--good);animation:pop .4s ease}
.opt.wrong{outline:4px solid var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;perspective:600px;min-width:0}
.mc .face{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.up .face,.mc.done .face{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}
.mc .b{background:linear-gradient(135deg,var(--sky),var(--berry));color:#fff;font-family:var(--display);font-weight:800;font-size:1.8rem}
.mc .f{background:var(--surface);transform:rotateY(180deg);padding:6px}
.mc .f img{width:100%;height:100%;object-fit:contain;background:var(--plate);border-radius:10px}
.mc .f .wd{font-family:var(--display);font-weight:800;font-size:.95rem;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.mc.done .f{outline:3px solid var(--good)}
@media (max-width:360px){.mem{gap:6px}.mc .f .wd{font-size:.8rem}}

/* spelling */
.spic{width:min(220px,60vw);aspect-ratio:1/1;margin:0 auto 12px;background:var(--plate);border-radius:20px;display:grid;place-items:center;overflow:hidden}
.spic img{width:100%;height:100%;object-fit:contain}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.slot{width:38px;height:46px;border-radius:12px;border-bottom:4px solid var(--line);background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:lowercase}
.slot.on{background:var(--sun);color:var(--sun-ink);border-bottom-color:#C98F00}
.slot.next{border-bottom-color:var(--sky)}
.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lt{width:52px;height:56px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--display);font-weight:800;font-size:1.7rem}
.lt[disabled]{opacity:.25;box-shadow:none;cursor:default}
.lt.bad{animation:shake .35s;outline:3px solid var(--bad)}

/* result */
.result{text-align:center;background:var(--surface);border-radius:28px;padding:26px 18px;box-shadow:var(--shadow)}
.result h2{font-family:var(--display);font-size:2rem;margin:0 0 4px}
.result .big{display:flex;justify-content:center;gap:6px;margin:10px 0 6px}
.result .big svg{width:54px;height:54px;color:var(--line);fill:currentColor}
.result .big svg.on{color:var(--sun);stroke:#C98F00;stroke-width:1;animation:pop .5s ease both}
.result .big svg.on:nth-child(2){animation-delay:.12s}.result .big svg.on:nth-child(3){animation-delay:.24s}
.result p{color:var(--muted);font-weight:700;margin:0 0 16px}
.result .btns{justify-content:center}
.voice{color:var(--muted);font-size:.8rem;font-weight:700;text-align:center;padding-block:14px 6px}
.voice.warn{color:var(--bad)}

.tabs .in{grid-template-columns:repeat(3,1fr)}
.tab{font-size:.95rem;gap:6px;padding:11px 4px}
.speed{display:flex;gap:6px;align-items:center;padding-bottom:8px}
.speed span{font-weight:800;color:var(--muted);font-size:.85rem;margin-right:2px}
.sp{flex:1;border-radius:999px;padding:7px 6px;font-weight:800;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);text-align:center}
.sp[aria-pressed="true"]{background:var(--sky);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sp[aria-pressed="true"]{color:#06203f}}
:root[data-theme="dark"] .sp[aria-pressed="true"]{color:#06203f}
.addrow{display:flex;gap:8px;padding-block:8px 0}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:20;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:24px;padding:18px;width:min(420px,100%);box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-family:var(--display);font-size:1.3rem}
.upl{display:grid;place-items:center;aspect-ratio:1/1;max-height:200px;width:100%;margin:0 auto;border:3px dashed var(--line);border-radius:20px;background:var(--bg);color:var(--muted);font-weight:800;text-align:center;cursor:pointer;overflow:hidden}
.upl img{width:100%;height:100%;object-fit:contain;background:#fff}
.inp{width:100%;font:inherit;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:10px}
.err{color:var(--bad);font-weight:800;font-size:.85rem;min-height:1.2em;margin-top:8px}
.rtxt{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.25;margin:6px 0 10px;overflow-wrap:anywhere}
.rtxt span{margin:0 3px;display:inline-block}
.rtxt .g{color:var(--good)}.rtxt .x{color:var(--bad);text-decoration:underline wavy;cursor:pointer}
.mic{background:var(--coral);margin-top:8px}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.verdict{margin-top:14px;border-radius:20px;padding:12px;font-weight:700}
.verdict h2{font-size:1.6rem;margin:0}.verdict p{margin:4px 0 0}
.verdict.ok{background:rgba(47,180,99,.16);color:var(--good)}
.verdict.try{background:rgba(240,80,110,.14);color:var(--bad)}
.heard{font-size:.8rem;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet.wide{width:min(560px,100%)}
.hint{margin:0 0 8px;color:var(--muted);font-size:.88rem;font-weight:700}
.upl.small{aspect-ratio:auto;min-height:110px;max-height:220px}
.gctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-weight:800}
.gctl select{font:inherit;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.irow{display:grid;grid-template-columns:72px 1fr 28px;gap:10px;align-items:center;margin-top:10px;padding:8px;border-radius:16px;background:var(--bg)}
.irow img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:12px}
.irow .f{display:grid;gap:6px;min-width:0}
.irow .inp{margin-top:0;padding:8px 10px}
.irow .ck{width:22px;height:22px;accent-color:var(--grass)}
.irow.off{opacity:.45}
.help{margin-top:12px;padding:12px;border-radius:18px;background:rgba(255,197,46,.2);text-align:left;font-weight:700;font-size:.9rem}
.help p{margin:6px 0}
.help .btn{margin-top:4px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Little English Garden<small>Nghe &middot; Nói &middot; Chơi</small></div>
        <div class="pill stars" aria-label="Tổng số sao"><svg class="ic" viewBox="0 0 24 24"><path d="m12 2.5 2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5 6.1 20.7l1.2-6.6L2.5 9.5l6.6-.9z"/></svg><span id="starCount">0</span></div>
  </header>
  <div class="speed" role="group" aria-label="Tốc độ"><span>Tốc độ:</span><button class="sp" type="button" data-s="slow">Chậm</button><button class="sp" type="button" data-s="mid">Vừa</button><button class="sp" type="button" data-s="fast">Nhanh</button></div>
  <main id="view"></main>
  <div class="voice" id="voiceInfo"></div>
</div>
<nav class="tabs" aria-label="Chọn phần">
  <div class="in">
    <button class="tab" id="tabLearn" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/></svg>Học từ</button>
    <button class="tab" id="tabPlay" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r=".8"/><circle cx="18.5" cy="14" r=".8"/></svg>Chơi game</button>
    <button class="tab" id="tabRead" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Luyện đọc</button>
  </div>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const view=$('#view');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(k,v){try{if(v===undefined){return localStorage.getItem(k)}localStorage.setItem(k,v)}catch(e){return null}}
let stars=parseInt(store('leg_stars')||'0',10)||0;
let best=JSON.parse(store('leg_best')||'{}')||{};
function addStars(n){stars+=n;$('#starCount').textContent=stars;store('leg_stars',String(stars))}
function setBest(g,n){if(!best[g]||n>best[g]){best[g]=n;store('leg_best',JSON.stringify(best))}}
$('#starCount').textContent=stars;

let voice=null,speakTimer=null,speed=store('leg_speed')||'mid';if(!['slow','mid','fast'].includes(speed))speed='mid';
const RATE={slow:.55,mid:.82,fast:1.05},PACE={slow:1.6,mid:1,fast:.55};const pace=ms=>ms*PACE[speed];
function pickVoice(){
  if(!('speechSynthesis' in window)){$('#voiceInfo').textContent='Thiết bị này chưa hỗ trợ đọc giọng nói.';$('#voiceInfo').className='voice warn';return}
  const vs=speechSynthesis.getVoices();
  const us=vs.filter(v=>/^en[-_]US$/i.test(v.lang));
  const pref=['Samantha','Google US English','Aria','Jenny','Ava','Allison','Nicky','Zira','Joelle','Evan'];
  voice=pref.map(n=>us.find(v=>v.name.includes(n))).find(Boolean)||us[0]||null;
  const el=$('#voiceInfo');
  if(voice){el.textContent='Giọng đọc: '+voice.name+' (Anh-Mỹ)';el.className='voice'}
  else if(vs.length){el.textContent='Máy chưa có giọng Anh-Mỹ, đang dùng giọng tiếng Anh mặc định. Có thể cài thêm trong Cài đặt > Trợ năng > Giọng nói.';el.className='voice warn'}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice)}
function speak(text,opts){
  if(!('speechSynthesis' in window))return;
  const rate=(opts&&opts.rate)||RATE[speed];
  clearTimeout(speakTimer);
  try{speechSynthesis.cancel()}catch(e){}
  speakTimer=setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate;u.pitch=1.08;u.volume=1;
    if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  },60);
}
document.querySelectorAll('.sp').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.s===speed));b.onclick=()=>{speed=b.dataset.s;store('leg_speed',speed);document.querySelectorAll('.sp').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));speak('Hello! Let us learn English.')}});

/* ---------- sound effects ---------- */
let AC=null;
function tone(freqs,dur,type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    let t=AC.currentTime;
    freqs.forEach(f=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;
    });
  }catch(e){}
}
const sfxOk=()=>tone([659,880,1175],.14);
const sfxNo=()=>tone([220,180],.16,'triangle');
const sfxWin=()=>tone([523,659,784,1047],.16);

/* ---------- game 1: listen and pick ---------- */
function gameListen(){
  const rounds=shuffle(POOL).slice(0,10);let i=0,got=0,tries=0,locked=false;const st=rounds.map(()=> 'todo');
  let alive=true;gameStop=()=>{alive=false;clearTimeout(nt)};let nt=null;
  function show(){
    const w=rounds[i];tries=0;locked=false;
    const opts=shuffle([w,...shuffle(POOL.filter(x=>x.id!==w.id)).slice(0,3)]);
    gameShell('Nghe và chọn',`${dotsHTML(st,i)}
      <div class="prompt"><h2>Bé nghe thấy từ nào?</h2><p>Chạm vào loa để nghe lại.</p>
        <button class="bigspk" type="button" id="rep" aria-label="Nghe lại">${ICON_SPK}</button></div>
      <div class="opts">${opts.map(o=>`<button class="opt" type="button" data-id="${o.id}" aria-label="Hình ${o.id}"><span class="th">${thumb(o)}</span></button>`).join('')}</div>`);
    $('#rep').onclick=()=>speak(w.en);
    view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;
      if(b.dataset.id===w.id){
        locked=true;b.classList.add('right');sfxOk();
        const first=tries===0;st[i]=first?'ok':'no';if(first){got++;addStars(1)}
        setTimeout(()=>speak(w.say),350);
        nt=setTimeout(()=>{if(!alive)return;i++;i<rounds.length?show():resultScreen('listen','Giỏi quá!',got,rounds.length,`Bé đúng ngay lần đầu ${got}/${rounds.length} câu.`,gameListen)},pace(1900));
      }else{
        tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');sfxNo();
        setTimeout(()=>speak(w.en),500);
      }
    });
    setTimeout(()=>{if(alive)speak(w.en)},300);
  }
  show();
}

/* ---------- game 2: memory match ---------- */
function gameMemory(){
  const pick=shuffle(POOL).slice(0,6);
  const cards=shuffle(pick.flatMap(w=>[{k:'img',w},{k:'word',w}]));
  let open=[],moves=0,done=0,busy=false,alive=true;gameStop=()=>{alive=false};
  gameShell('Lật thẻ ghép đôi',`<div class="prompt"><h2>Tìm hình và từ giống nhau</h2><p>Số lượt: <b id="mv">0</b> &nbsp;·&nbsp; Đã ghép: <b id="dn">0</b>/6</p></div>
    <div class="mem">${cards.map((c,i)=>`<button class="mc" type="button" data-i="${i}" aria-label="Thẻ ${i+1}"><span class="face"><span class="b">?</span><span class="f">${c.k==='img'?thumb(c.w):`<span class="wd">${c.w.en}</span>`}</span></span></button>`).join('')}</div>`);
  const els=[...view.querySelectorAll('.mc')];
  els.forEach((el,i)=>el.onclick=()=>{
    if(busy||el.classList.contains('up')||el.classList.contains('done'))return;
    el.classList.add('up');speak(cards[i].w.en);open.push(i);
    if(open.length<2)return;
    moves++;$('#mv').textContent=moves;busy=true;
    const [a,b]=open;open=[];
    const ok=cards[a].w.id===cards[b].w.id&&cards[a].k!==cards[b].k;
    setTimeout(()=>{
      if(!alive)return;
      if(ok){
        [a,b].forEach(x=>{els[x].classList.remove('up');els[x].classList.add('done')});done++;$('#dn').textContent=done;sfxOk();
        busy=false;
        if(done===6){
          const n=moves<=10?3:moves<=16?2:1;addStars(n);
          setTimeout(()=>{if(alive)resultScreen('memory','Bé nhớ giỏi lắm!',n,3,`Bé ghép xong sau ${moves} lượt.`,gameMemory)},900);
        }
      }else{
        sfxNo();[a,b].forEach(x=>els[x].classList.remove('up'));setTimeout(()=>{busy=false},350);
      }
    },pace(ok?900:1100));
  });
}

/* ---------- game 3: spell the word ---------- */
function gameSpell(){
  const rounds=shuffle(POOL).slice(0,8);let i=0,got=0,alive=true,nt=null;
  const st=rounds.map(()=> 'todo');gameStop=()=>{alive=false;clearTimeout(nt)};
  function show(){
    const w=rounds[i],word=w.en.toLowerCase();let pos=0,mistakes=0,locked=false;
    let letters=word.split('');
    for(let t=0;t<6&&letters.join('')===word&&word.length>2;t++)letters=shuffle(letters);
    gameShell('Xếp chữ',`${dotsHTML(st,i)}
      <div class="prompt"><div class="spic">${thumb(w)}</div>
        <p>${w.vi}</p>
        <div class="slots" id="slots">${word.split('').map((_,k)=>`<span class="slot ${k===0?'next':''}"></span>`).join('')}</div>
        <div class="btns" style="justify-content:center;margin:0"><button class="btn" type="button" id="hint">${ICON_SPK}Nghe từ</button></div></div>
      <div class="letters" id="letters">${letters.map((c,k)=>`<button class="lt" type="button" data-k="${k}" data-c="${c}">${c}</button>`).join('')}</div>`);
    const slots=[...view.querySelectorAll('.slot')];
    $('#hint').onclick=()=>speak(w.en);
    view.querySelectorAll('.lt').forEach(b=>b.onclick=()=>{
      if(locked||b.disabled)return;
      if(b.dataset.c===word[pos]){
        slots[pos].textContent=b.dataset.c;slots[pos].classList.add('on');slots[pos].classList.remove('next');
        b.disabled=true;pos++;tone([700+pos*60],.1);
        if(pos<word.length){slots[pos].classList.add('next')}
        else{
          locked=true;sfxOk();const first=mistakes===0;st[i]=first?'ok':'no';if(first){got++;addStars(1)}
          setTimeout(()=>speak(w.say),300);
          nt=setTimeout(()=>{if(!alive)return;i++;i<rounds.length?show():resultScreen('spell','Giỏi quá!',got,rounds.length,`Bé xếp đúng ngay lần đầu ${got}/${rounds.length} từ.`,gameSpell)},pace(2000));
        }
      }else{
        mistakes++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');sfxNo();
      }
    });
    setTimeout(()=>{if(alive)speak(w.en)},300);
  }
  show();
}

/* ---------- grid / flashcard-sheet analysis (pure functions) ---------- */
function gl_runs(m,W,H,vertical){
  const n=vertical?W:H,L=vertical?H:W,best=new Int32Array(n),cur=new Int32Array(n);
  for(let a=0;a<L;a++)for(let b=0;b<n;b++){
    const v=vertical?m[a*W+b]:m[b*W+a];
    if(v){cur[b]++;if(cur[b]>best[b])best[b]=cur[b]}else cur[b]=0;
  }
  return best;
}
function gl_groups(idx,tol){const g=[];idx.forEach(i=>{const l=g[g.length-1];if(l&&i-l[1]<=tol)l[1]=i;else g.push([i,i])});return g}
function gridBoxes(d,W,H,rows,cols){
  const mean=(x0,y0)=>{let r=0,g=0,b=0,n=0;for(let y=y0;y<y0+6;y++)for(let x=x0;x<x0+6;x++){const i=(y*W+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++}return[r/n,g/n,b/n]};
  const cs=[mean(2,2),mean(W-8,2),mean(2,H-8),mean(W-8,H-8)];
  const med=k=>{const v=cs.map(c=>c[k]).sort((a,b)=>a-b);return(v[1]+v[2])/2};
  const bg=[med(0),med(1),med(2)];
  const uniform=cs.every(c=>Math.hypot(c[0]-bg[0],c[1]-bg[1],c[2]-bg[2])<40);
  const fg=new Uint8Array(W*H);
  if(uniform)for(let i=0;i<W*H;i++){const j=i*4;fg[i]=Math.hypot(d[j]-bg[0],d[j+1]-bg[1],d[j+2]-bg[2])>60?1:0}
  // card borders: long thin lines
  let vc=[],hr=[];
  if(uniform){
    const v=gl_runs(fg,W,H,true),h=gl_runs(fg,W,H,false);
    for(let x=0;x<W;x++)if(v[x]>=.3*H)vc.push(x);
    for(let y=0;y<H;y++)if(h[y]>=.24*W)hr.push(y);
  }
  const gv=gl_groups(vc,15).length,gh=gl_groups(hr,15).length;
  if(!rows||!cols){
    if(gv>=2&&gh>=2&&gv%2===0&&gh%2===0){cols=gv/2;rows=gh/2}
    else{cols=1;rows=1}
  }
  const out={bg:uniform?bg:null,rows,cols,boxes:[]};
  if(!uniform||rows*cols===1){
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x0=Math.round(c*W/cols),x1=Math.round((c+1)*W/cols),y0=Math.round(r*H/rows),y1=Math.round((r+1)*H/rows);
      const ix=Math.round(.03*(x1-x0)),iy=Math.round(.03*(y1-y0));
      out.boxes.push({x:x0+ix,y:y0+iy,w:x1-x0-2*ix,h:y1-y0-2*iy,plain:true});
    }
    return out;
  }
  const clean=Uint8Array.from(fg);
  const clr=(x0,y0,x1,y1)=>{x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(W-1,x1);y1=Math.min(H-1,y1);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)clean[y*W+x]=0};
  vc.forEach(x=>clr(x-4,0,x+4,H-1));hr.forEach(y=>clr(0,y-4,W-1,y+4));
  const ux=[...new Set(vc)],uy=[...new Set(hr)];
  ux.forEach(x=>uy.forEach(y=>clr(x-18,y-18,x+18,y+18))); // sparkles on card corners
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x0=Math.round(c*W/cols),x1=Math.round((c+1)*W/cols),y0=Math.round(r*H/rows),y1=Math.round((r+1)*H/rows);
    const cw=x1-x0,ch=y1-y0,rc=new Int32Array(ch);
    for(let y=0;y<ch;y++){let s=0;for(let x=0;x<cw;x++)s+=clean[(y0+y)*W+x0+x];rc[y]=s}
    let runs=[],s=-1;
    for(let y=0;y<ch;y++){const h=rc[y]>2;if(h&&s<0)s=y;if(!h&&s>=0){runs.push([s,y-1]);s=-1}}
    if(s>=0)runs.push([s,ch-1]);
    if(!runs.length){out.boxes.push({x:x0,y:y0,w:cw,h:ch,plain:true});continue}
    const g1=Math.max(3,Math.round(.009*ch));let m=[];
    runs.forEach(r2=>{const l=m[m.length-1];if(l&&r2[0]-l[1]<=g1)l[1]=r2[1];else m.push([r2[0],r2[1]])});
    const tiny=.035*ch,g2=.04*ch;let ch2=true;
    while(ch2&&m.length>1){ch2=false;
      for(let i=0;i<m.length;i++){const q=m[i];
        if(q[1]-q[0]<tiny){const gp=i>0?q[0]-m[i-1][1]:1e9,gn=i<m.length-1?m[i+1][0]-q[1]:1e9;
          if(Math.min(gp,gn)<=g2){if(gp<=gn)m[i-1][1]=q[1];else m[i+1][0]=q[0];m.splice(i,1);ch2=true;break}}}}
    const keep=m.slice();let t=0;
    while(t<2&&keep.length>1&&keep[keep.length-1][1]-keep[keep.length-1][0]<=.17*ch){keep.pop();t++}
    const ya=keep[0][0],yb=keep[keep.length-1][1];
    let xa=1e9,xb=-1;
    for(let y=ya;y<=yb;y++)for(let x=0;x<cw;x++)if(clean[(y0+y)*W+x0+x]){if(x<xa)xa=x;if(x>xb)xb=x}
    if(xb<0){out.boxes.push({x:x0,y:y0,w:cw,h:ch,plain:true});continue}
    const pad=8,nxt=keep.length<m.length?m[keep.length][0]:ch;
    const bx0=Math.max(0,xa-pad),bx1=Math.min(cw,xb+pad+1),by0=Math.max(0,ya-pad),by1=Math.min(ch,yb+Math.min(pad,Math.max(0,nxt-yb-3))+1);
    let ax0=x0+bx0,ax1=x0+bx1,ay0=y0+by0,ay1=y0+by1;
    // keep padding off the card border lines
    hr.forEach(y=>{if(y<y0+ya)ay0=Math.max(ay0,y+5);else if(y>y0+yb)ay1=Math.min(ay1,y-4)});
    vc.forEach(x=>{if(x<x0+xa)ax0=Math.max(ax0,x+5);else if(x>x0+xb)ax1=Math.min(ax1,x-4)});
    out.boxes.push({x:ax0,y:ay0,w:ax1-ax0,h:ay1-ay0});
  }
  return out;
}
// make the flat backdrop white (soft edges) so pictures sit on the app's white plates
function keyBg(d,w,h,bg){
  const T=48,dist=i=>Math.hypot(d[i]-bg[0],d[i+1]-bg[1],d[i+2]-bg[2]);
  const isbg=new Uint8Array(w*h),st=[];
  const push=(x,y)=>{const p=y*w+x;if(!isbg[p]&&dist(p*4)<T){isbg[p]=1;st.push(p)}};
  for(let x=0;x<w;x++){push(x,0);push(x,h-1)}for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
  while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1)}
  for(let p=0;p<w*h;p++)if(!isbg[p]&&dist(p*4)<30)isbg[p]=1;
  const o=new Uint8ClampedArray(d.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const p=y*w+x,i=p*4;
    if(isbg[p]){o[i]=o[i+1]=o[i+2]=255;o[i+3]=255;continue}
    let near=false;
    for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&isbg[yy*w+xx]){near=true;break}}
    if(!near){o[i]=d[i];o[i+1]=d[i+1];o[i+2]=d[i+2];o[i+3]=255;continue}
    const a=Math.min(1,Math.max(0,(dist(i)-30)/80));
    for(let k=0;k<3;k++){const c=a>0.02?Math.min(255,Math.max(0,(d[i+k]-(1-a)*bg[k])/a)):255;o[i+k]=a*c+(1-a)*255}
    o[i+3]=255;
  }
  return o;
}

async function getSample(){try{if(!window.claude||!window.claude.use)return null;return await window.claude.use('sample')||null}catch(e){return null}}
function fit256(c){
  const o=document.createElement('canvas');o.width=o.height=256;const x=o.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,256,256);const k=Math.min(240/c.width,240/c.height);
  x.drawImage(c,(256-c.width*k)/2,(256-c.height*k)/2,c.width*k,c.height*k);
  return o.toDataURL('image/jpeg',.85);
}
function openAdd(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet wide"><h3>Thêm từ mới từ ảnh</h3>
    <p class="hint">Chọn ảnh một vật, hoặc ảnh bảng thẻ từ vựng nhiều ô (như ảnh Quả bóng / Xe đạp / Quyển sách…). App tự tách từng ô, cắt hình và tự đọc chữ.</p>
    <label class="upl small" for="fi"><span id="pv">Chạm để chụp / chọn ảnh</span></label><input id="fi" type="file" accept="image/*" hidden>
    <div class="gctl" id="gctl" hidden>Cột <select id="gc"></select> Hàng <select id="gr"></select>
      <button class="btn ghost" type="button" id="rd">Đọc chữ lại</button></div>
    <div class="hint" id="ai"></div>
    <div id="items"></div>
    <div class="err" id="ferr"></div>
    <div class="btns"><button class="btn alt" type="button" id="fok">Lưu các từ đã chọn</button><button class="btn ghost" type="button" id="fno">Hủy</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove(),err=t=>{$('#ferr').textContent=t},ai=t=>{$('#ai').textContent=t};
  let src=null,idata=null,items=[],rows=1,cols=1,seq=0;
  $('#fno').onclick=close;
  const opt=n=>[1,2,3,4,5,6].map(i=>`<option value="${i}" ${i===n?'selected':''}>${i}</option>`).join('');
  function renderItems(){
    $('#items').innerHTML=items.map((it,i)=>`<div class="irow ${it.on?'':'off'}" data-i="${i}">
      <img src="${it.data}" alt="">
      <div class="f"><input class="inp" data-k="en" placeholder="Từ tiếng Anh" autocapitalize="none" autocomplete="off" value="${it.en}">
      <input class="inp" data-k="vi" placeholder="Nghĩa tiếng Việt" value="${it.vi}"></div>
      <input type="checkbox" class="ck" ${it.on?'checked':''} aria-label="Lưu từ này"></div>`).join('');
    $('#items').querySelectorAll('.irow').forEach(row=>{
      const it=items[+row.dataset.i];
      row.querySelectorAll('.inp').forEach(inp=>inp.oninput=()=>{it[inp.dataset.k]=inp.value});
      row.querySelector('.ck').onchange=e=>{it.on=e.target.checked;row.classList.toggle('off',!it.on)};
    });
  }
  function build(r,c){
    const g=gridBoxes(idata.data,src.width,src.height,r,c);rows=g.rows;cols=g.cols;
    $('#gc').innerHTML=opt(cols);$('#gr').innerHTML=opt(rows);$('#gctl').hidden=rows*cols<2&&!g.bg;
    const sx=src.getContext('2d');
    items=g.boxes.map(b=>{
      const cv=document.createElement('canvas');cv.width=b.w;cv.height=b.h;const x=cv.getContext('2d');
      if(g.bg&&!b.plain){const id=sx.getImageData(b.x,b.y,b.w,b.h);x.putImageData(new ImageData(keyBg(id.data,b.w,b.h,g.bg),b.w,b.h),0,0)}
      else x.drawImage(src,b.x,b.y,b.w,b.h,0,0,b.w,b.h);
      return {data:fit256(cv),en:'',vi:'',on:true};
    });
    renderItems();
  }
  async function readText(){
    const my=++seq,s=await getSample();
    if(!s){ai('Chưa tự đọc chữ được ở chế độ này. Bé hoặc phụ huynh nhập chữ vào từng ô nhé.');return}
    let lim=null;try{lim=await s.limits()}catch(e){}
    if(!lim||!lim.images){ai('Chưa tự đọc chữ được ở chế độ này. Bé hoặc phụ huynh nhập chữ vào từng ô nhé.');return}
    ai('Đang đọc chữ trong ảnh…');
    try{
      const blob=await new Promise(r=>src.toBlob(r,'image/jpeg',.88));
      const n=items.length;
      const arr=await s.json(`This image is either a bilingual English–Vietnamese vocabulary flashcard sheet or a single photo of an object. The app split it into ${rows} row(s) × ${cols} column(s) = ${n} cell(s). Return ONLY a JSON array of exactly ${n} objects in reading order (left to right, then top to bottom): [{"en":"...","vi":"..."}]. "en" = the printed English word in lowercase (if there is no printed text, give the best single English noun for the picture). "vi" = the printed Vietnamese text copied exactly with all diacritics (if none printed, give a short Vietnamese translation).`,{images:blob,modelTier:'quick'});
      if(my!==seq||!document.body.contains(m))return;
      if(!Array.isArray(arr))throw 0;
      items.forEach((it,i)=>{
        const a=arr[i]||{};
        it.en=String(a.en||'').toLowerCase().replace(/[^a-z]/g,'');it.vi=String(a.vi||'').trim();
        it.on=!(it.en&&WORDS.some(w=>w.en===it.en)); // already in the app
      });
      renderItems();
      ai('Đã tự đọc xong. Bé kiểm tra lại chữ rồi bấm Lưu nhé. Từ đã có sẵn trong app được bỏ chọn.');
    }catch(e){
      const c=e&&e.code;
      ai(c==='not_granted'?'Chưa cho phép Claude đọc ảnh, nhập chữ bằng tay nhé.':c==='rate_limited'?'Đang bận, thử lại sau ít phút hoặc nhập chữ bằng tay.':'Không tự đọc được chữ, nhập chữ bằng tay nhé.');
    }
  }
  $('#fi').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();err('');
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,1400/Math.max(im.width,im.height));
      src=document.createElement('canvas');src.width=Math.round(im.width*k);src.height=Math.round(im.height*k);
      src.getContext('2d',{willReadFrequently:true}).drawImage(im,0,0,src.width,src.height);
      idata=src.getContext('2d').getImageData(0,0,src.width,src.height);
      $('#pv').innerHTML=`<img src="${src.toDataURL('image/jpeg',.6)}" alt="">`;
      build(null,null);ai('');readText();
    };im.onerror=()=>err('Không đọc được ảnh này.');im.src=r.result};
    r.readAsDataURL(f);
  };
  const regrid=()=>{if(idata){build(+$('#gr').value,+$('#gc').value);ai('Đã chia lại ô. Bấm "Đọc chữ lại" để tự điền chữ.')}};
  $('#gc').onchange=regrid;$('#gr').onchange=regrid;$('#rd').onclick=readText;
  $('#fok').onclick=()=>{
    if(!items.length)return err('Bé chọn một ảnh trước nhé.');
    const pick=items.filter(it=>it.on);
    if(!pick.length)return err('Chưa chọn từ nào để lưu.');
    const added=[],seen=new Set();let skipped=0;
    for(const it of pick){
      const en=it.en.trim().toLowerCase(),vi=it.vi.trim();
      if(!/^[a-z]+$/.test(en))return err('Từ tiếng Anh chỉ gồm một từ, chỉ dùng chữ cái a–z.');
      if(!vi)return err(`Hãy nhập nghĩa tiếng Việt cho từ “${en}”.`);
      if(byId['my_'+en]||WORDS.some(w=>w.en===en)||seen.has(en)){skipped++;continue}
      seen.add(en);
      added.push({id:'my_'+en,en,vi,cat:'mine',say:`This is ${/^[aeiou]/.test(en)?'an':'a'} ${en}.`,img:it.data});
    }
    if(!added.length)return err('Các từ này đã có rồi.');
    custom.push(...added);
    if(!saveCustom()){custom.length-=added.length;return err('Bộ nhớ máy đã đầy, hãy xóa bớt từ cũ.')}
    added.forEach(regWord);
    cat='mine';selId=added[0].id;close();renderLearn();speak(added[0].en);
  };
}

/* ---------- reading practice ---------- */
let rmode='word',rIdx=0,rList=[],rec=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const toks=s=>s.toLowerCase().replace(/\bi am\b/g,"i'm").replace(/\d+/g,n=>NUM[+n]||n).replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean).map(t=>t.replace(/'/g,''));
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function grade(target,heard){
  const h=toks(heard),used=new Set();
  return target.split(/\s+/).map(dw=>{const t=toks(dw).join('');if(!t)return true;
    const k=h.findIndex((x,i)=>!used.has(i)&&(x===t||(t.length>3&&lev(x,t)<=1)));
    if(k>=0){used.add(k);return true}return false});
}
function renderRead(){
  if(!rList.length){rList=shuffle(rmode==='word'?WORDS:ALL);rIdx=0}
  const w=rList[rIdx%rList.length],txt=rmode==='word'?w.en:w.say;
  view.innerHTML=`<div class="chips" style="padding-top:4px">${[['word','Đọc từ'],['sent','Đọc câu']].map(([k,l])=>`<button class="chip" type="button" data-m="${k}" aria-pressed="${k===rmode}">${l}</button>`).join('')}</div>
    <div class="prompt"><div class="spic">${thumb(w)}</div><p>${w.vi}</p>
      <div class="rtxt" id="rtxt">${txt}</div>
      <div class="btns" style="justify-content:center;margin:0"><button class="btn" type="button" id="rhear">${ICON_SPK}Nghe mẫu</button></div>
      <button class="bigspk mic" type="button" id="mic" aria-label="Bấm để đọc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <p id="rst">${SR?'Chạm micro rồi đọc to nhé.':'Máy này chưa hỗ trợ nhận giọng, phụ huynh chấm giúp bé nhé.'}</p>
      <div id="rhelp"></div>
      <div id="rres"></div>
      <div class="btns" style="justify-content:center;margin:0"><button class="btn ghost" type="button" id="rnext">${rmode==='word'?'Từ khác':'Câu khác'}</button></div></div>`;
  view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{rmode=b.dataset.m;rList=[];renderRead()});
  $('#rhear').onclick=()=>speak(txt);
  $('#rnext').onclick=()=>{rIdx++;renderRead()};
  $('#mic').onclick=()=>startRead(txt);
  if(!SR)manual(txt);
  else try{navigator.permissions.query({name:'microphone'}).then(p=>{if(p.state==='denied'&&$('#rhelp')&&!$('#rhelp').innerHTML){micBlocked(txt,'not-allowed');manual(txt)}}).catch(()=>{})}catch(e){}
}
function micBlocked(txt,code){
  let framed=false;try{framed=window.self!==window.top}catch(e){framed=true}
  const el=$('#rhelp');if(!el)return;
  const why=code==='service-not-allowed'
    ?'Máy chưa bật nhận dạng giọng nói. iPhone: Cài đặt > Cài đặt chung > Bàn phím > bật “Đọc chính tả”. Android: kiểm tra ứng dụng Google đang bật và máy có mạng.'
    :'Trang này chưa được phép dùng micro. iPhone (Safari): bấm chữ “aA” ở thanh địa chỉ > Cài đặt trang web > Micro > Cho phép. Android (Chrome): bấm biểu tượng ổ khóa cạnh địa chỉ > Quyền > Micro > Cho phép. Sau đó tải lại trang.';
  el.innerHTML=`<div class="help"><b>Chưa bật được micro</b><p>${why}</p>${framed?'<p>Nếu app đang mở bên trong một ứng dụng khác (ví dụ trong khung xem của Claude), trình duyệt có thể chặn micro. Hãy thử mở liên kết bằng Safari hoặc Chrome.</p>':''}<button class="btn" type="button" id="micask">Thử bật micro</button><p id="micmsg"></p></div>`;
  $('#micask').onclick=async()=>{
    const msg=t=>{const q=$('#micmsg');if(q)q.textContent=t};
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Trình duyệt này không cho dùng micro. Hãy mở bằng Safari hoặc Chrome.');
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());msg('Micro đã bật! Bấm nút micro tròn để đọc nhé.');const h=$('#rst');if(h)h.textContent='Chạm micro rồi đọc to nhé.'}
    catch(e){msg(e.name==='NotFoundError'?'Máy không tìm thấy micro.':'Micro vẫn đang bị chặn. Làm theo các bước ở trên rồi tải lại trang nhé.')}
  };
}

function verdict(great,n,m){
  return `<div class="verdict ${great?'ok':'try'}"><h2>${great?'Tuyệt vời!':'Cần cố gắng hơn nhé!'}</h2><p>${n!=null?`Bé đọc đúng ${n}/${m} từ. `:''}${great?'Bé đọc rất hay!':'Bé nghe mẫu rồi đọc lại lần nữa nhé.'}</p></div>`;
}
function manual(txt){
  $('#rres').innerHTML=`<div class="btns" style="justify-content:center"><button class="btn" type="button" id="mg">Bé đọc tốt</button><button class="btn ghost" type="button" id="mb">Cần cố gắng hơn</button></div><div id="mv"></div>`;
  const f=g=>{$('#mv').innerHTML=verdict(g);g?(sfxOk(),addStars(1)):sfxNo()};
  $('#mg').onclick=()=>f(true);$('#mb').onclick=()=>f(false);
}
function showRes(txt,g,heard){
  const n=g.filter(Boolean).length,great=n/g.length>=0.8,dw=txt.split(/\s+/);
  $('#rtxt').innerHTML=dw.map((x,i)=>`<span class="${g[i]?'g':'x'}" data-w="${x}">${x}</span>`).join(' ');
  $('#rtxt').querySelectorAll('.x').forEach(e=>e.onclick=()=>speak(e.dataset.w.replace(/[^\w']/g,'')));
  $('#rres').innerHTML=verdict(great,n,g.length)+'<div class="heard"></div>';
  $('#rres .heard').textContent='Máy nghe được: “'+heard+'”';
  if(great){sfxOk();addStars(1)}else sfxNo();
}
function startRead(txt){
  if(!SR)return;
  try{speechSynthesis.cancel()}catch(e){}
  if(rec){try{rec.abort()}catch(e){}}
  const r=rec=new SR(),mic=$('#mic');r.lang='en-US';r.maxAlternatives=3;r.interimResults=false;
  mic.classList.add('on');$('#rst').textContent='Đang nghe… bé đọc đi nào!';$('#rres').innerHTML='';
  let ok=false;
  r.onresult=e=>{ok=true;let best=null;[...e.results[0]].forEach(a=>{const g=grade(txt,a.transcript),sc=g.filter(Boolean).length;if(!best||sc>best.sc)best={g,sc,a:a.transcript}});$('#rst').textContent='';showRes(txt,best.g,best.a)};
  r.onerror=e=>{ok=true;if(!$('#rst'))return;if(/not-allowed|service|audio-capture/.test(e.error)){$('#rst').textContent='Chưa bật micro. Xem hướng dẫn bên dưới, hoặc phụ huynh chấm giúp bé.';micBlocked(txt,e.error);manual(txt)}else $('#rst').textContent='Chưa nghe rõ, bé thử lại nhé.'};
  r.onend=()=>{const m=$('#mic');if(m)m.classList.remove('on');if(!ok&&$('#rst'))$('#rst').textContent='Chưa nghe rõ, bé thử lại nhé.'};
  try{r.start()}catch(e){mic.classList.remove('on')}
}

route();
